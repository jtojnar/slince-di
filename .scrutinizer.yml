filter:
    excluded_paths:
        - "Tests/*"
        - "vendor/*"

tools:
    external_code_coverage:
        timeout: 600

    php_analyzer:
        enabled: true
        filter:
            excluded_paths:
                - "Tests/*"
                - "vendor/*"


    php_cpd:
        enabled: true
        excluded_dirs:
            - "Tests/*"
            - "vendor/*"

    php_loc:
        enabled: true
        excluded_dirs:
            - "Tests/*"
            - "vendor/*"
            
build:
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run
